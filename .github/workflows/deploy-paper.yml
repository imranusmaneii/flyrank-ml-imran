name: deploy-paper

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'outputs/charts/**'
      - 'work/notebooks/**'
      - 'submission/paper_url.txt'
      - '.github/workflows/deploy-paper.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble paper site
        run: |
          rm -rf _site
          mkdir -p _site/outputs/charts _site/work/notebooks
          cp docs/index.html _site/index.html
          cp outputs/charts/*.svg _site/outputs/charts/
          cp work/notebooks/capstone.ipynb _site/work/notebooks/
          cp outputs/model_report.md _site/outputs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
